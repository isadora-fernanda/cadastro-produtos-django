{% extends 'produtos/base.html' %}

{% block title %}Excluir {{ produto.nome }}{% endblock %}

{% block content %}
<h1>Excluir produto?</h1>

<form method="post" class="confirmacao">
  {% csrf_token %}
  <p>O produto <strong>{{ produto.nome }}</strong> e a imagem dele serão apagados. Isso não pode ser desfeito.</p>
  <p class="acoes">
    <button type="submit" class="botao perigo-cheio">Excluir</button>
    <a href="{% url 'detalhe_produto' produto.id %}">Cancelar</a>
  </p>
</form>
{% endblock %}
