{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Produtos{% endblock %} · Cadastro de Produtos</title>
  <link rel="stylesheet" href="{% static 'produtos/css/style.css' %}">
</head>
<body>
  <header class="topo">
    <a href="{% url 'lista_produtos' %}">Cadastro de Produtos</a>
  </header>

  <main>
    {% for message in messages %}
      <p class="aviso">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
